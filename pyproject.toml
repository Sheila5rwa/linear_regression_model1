[project]
name = "agrismart-api"
version = "0.1.0"
description = "FastAPI service for crop yield prediction"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
